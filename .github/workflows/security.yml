name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Run Go security analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet ./...

  container:
    name: Container and configuration scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build production image
        run: docker build --tag dropwatch:security-scan .

      - name: Scan image for every known vulnerability
        env:
          GOEXPERIMENT: jsonv2
        run: >-
          go run github.com/aquasecurity/trivy/cmd/trivy@v0.72.0 image
          --scanners vuln
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --exit-code 1
          --no-progress
          dropwatch:security-scan

      - name: Scan repository configuration
        env:
          GOEXPERIMENT: jsonv2
        run: >-
          go run github.com/aquasecurity/trivy/cmd/trivy@v0.72.0 config
          --severity HIGH,CRITICAL
          --exit-code 1
          .
